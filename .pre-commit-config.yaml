repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        types: [python]
        pass_filenames: false
