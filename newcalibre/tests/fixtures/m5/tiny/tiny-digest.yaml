schema: 1
dataset:
  name: m5
  phase: evaluation
  data_dir: tests/fixtures/m5/tiny/data
  inventory: tests/fixtures/m5/tiny/inventory.json
protocol:
  horizon: 28
  origin_count: 64
  population:
    kind: digest_rank
    bottom_count: 1
    salt: tier1-tiny
pipeline:
  model:
    backend: seasonal-naive
    m: 7
    model_name: seasonal-naive
    quantile_levels: []
    censoring_aware: false
    scope: global
  reconciliation:
    strategy: wls_struct
  conformal:
    method: split-per-step
    coverage: 0.9
    calibration_window: 10
    partition: series-horizon
    upper_floor: null
    upper_cap: null
execution:
  backend: ray
  logical_shards: 16
  workers: 16
  numeric_threads_per_worker: 1
  retries: 0
output_dir: results/m5/tier1-tiny
