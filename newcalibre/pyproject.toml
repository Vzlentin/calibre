[project]
name = "newcalibre"
version = "0.1.0"
description = "Greenfield demand-planning engine built from the Calibre architecture spec."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newcalibre"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true
markers = [
    "tier0: static gates - lint, types, and schema validation (every commit)",
    "tier1: synthetic conformance without oracle, captures, or network (every commit)",
    "tier2: tolerance-class-4 self-consistency (every merge)",
    "tier3: conditional replay against promoted oracle captures (scheduled/manual)",
    "tier4: protocol acceptance at scale (scheduled verify-only/manual evidence)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
    "D100",
    "D104",
    "D101",
    "D103",
    "D205",
    "D212",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D103", "D104"]

[tool.ty.environment]
python-version = "3.12"
