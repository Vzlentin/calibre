config_schema: "1.0"
dataset:
  adapter: m5
  path: data/m5
  phase: evaluation
tasks:
  - model: SeasonalNaive
    horizon: 28
    config:
      backend: statsforecast
      season_length: 7
reconciliation:
  strategy: bottom_up
conformal:
  method: mscp
  mode: perhorizon
  coverage: 0.9
  partition: series
origins:
  # 64 daily origins = 37 origins for finite h=28 MSCP + 27-day settlement.
  start: 2016-03-20
  end: 2016-05-22
  freq: D
output:
  ledger_path: results/m5/full-mscp-bottom-up/forecast-ledger.parquet
  streaming: true
execution:
  backend: auto
  seed: 42
