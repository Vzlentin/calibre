config_schema: "1.0"
# Cost/RAM probe: full-M5 data + the coherent mscp policy, clipped to a few
# origins to harvest per-origin wall-clock and peak RAM for extrapolating the
# exclusive 64-origin run. NOT an acceptance config (too few origins to calibrate).
dataset:
  adapter: m5
  path: data/m5
  phase: evaluation
tasks:
  - model: SeasonalNaive
    horizon: 28
    config:
      backend: statsforecast
      season_length: 7
      scope: global
reconciliation:
  strategy: none
conformal:
  method: mscp
  mode: perhorizon
  spread: coherent_draws
  draw_count: 200
  draw_seed: 0
  coverage: 0.9
  calibration_window: 10
  partition: series
  max_partitions: 1000000
origins:
  start: 2016-03-20
  end: 2016-03-23
  freq: D
output:
  ledger_path: results/m5/probe-coherent-mscp/forecast-ledger.parquet
  streaming: true
execution:
  backend: auto
  seed: 42
