config_schema: "1.0"
dataset:
  adapter: m5
  path: data/m5
  phase: evaluation
tasks:
  - model: SeasonalNaive
    horizon: 28
    config:
      backend: statsforecast
      season_length: 7
      # Global scope: one vectorized statsforecast panel call per origin.
      # Local scope at M5 scale means 30,490 per-series tasks per origin and
      # the run drowns in task-dispatch overhead (~3 min/origin predict);
      # SeasonalNaive forecasts are identical either way.
      scope: global
reconciliation:
  # Sparse-capable MinT: reconciles through MinTraceSparse on a csr summing
  # matrix built from hierarchy index facts (~2.7 MB at full M5 instead of the
  # ~7.6 GiB dense S), so the full lattice fits commodity memory. Structural
  # weights exercise the sparse solve more representatively than ols's
  # identity weights, without wls_var's residual-estimation dependency.
  strategy: wls_struct
conformal:
  method: mscp
  mode: perhorizon
  coverage: 0.9
  calibration_window: 10
  partition: series
  # Explicit guard for conformal calibration state cardinality only. The CLI
  # separately preflights node-history materialization before hierarchy expansion.
  max_partitions: 1000000
origins:
  # 64 daily origins = 37 origins for finite h=28 MSCP + 27-day settlement.
  start: 2016-03-20
  end: 2016-05-22
  freq: D
output:
  ledger_path: results/m5/full-mscp-wls-struct/forecast-ledger.parquet
  streaming: true
execution:
  backend: auto
  seed: 42
