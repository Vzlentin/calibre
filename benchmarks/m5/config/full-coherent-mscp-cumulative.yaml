config_schema: "1.0"
dataset:
  adapter: m5
  path: data/m5
  phase: evaluation
tasks:
  - model: SeasonalNaive
    horizon: 28
    config:
      backend: statsforecast
      season_length: 7
      scope: global
reconciliation:
  strategy: none
conformal:
  method: mscp
  # Cumulative (protection-period) coherent mode: one terminal-H bound over the
  # h<=protection_period window per (uid, model, origin), summed natively off the
  # coherent draw matrix. Reported-only (a path-coverage measurement, not the
  # per-horizon acceptance anchor).
  mode: cumulative
  protection_period: 28
  spread: coherent_draws
  draw_count: 200
  draw_seed: 0
  coverage: 0.9
  calibration_window: 10
  partition: series
  max_partitions: 1000000
origins:
  start: 2016-03-20
  end: 2016-05-22
  freq: D
output:
  ledger_path: results/m5/full-coherent-mscp-cumulative/forecast-ledger.parquet
  streaming: true
execution:
  backend: auto
  seed: 42
