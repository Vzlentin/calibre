config_schema: "1.0"
# Preview: full-M5 data + coherent mscp, 16 origins — enough to fill the
# calibration_window (10) so finite intervals emit (origins 11-16) and a rough
# coverage signal lands on the early calibrated+resolved rows, BEFORE the
# exclusive 64-origin run. NOT the acceptance config (truncated window).
dataset:
  adapter: m5
  path: data/m5
  phase: evaluation
tasks:
  - model: SeasonalNaive
    horizon: 28
    config:
      backend: statsforecast
      season_length: 7
      scope: global
reconciliation:
  strategy: none
conformal:
  method: mscp
  mode: perhorizon
  spread: coherent_draws
  draw_count: 200
  draw_seed: 0
  coverage: 0.9
  calibration_window: 10
  partition: series
  max_partitions: 1000000
origins:
  start: 2016-03-20
  end: 2016-04-04
  freq: D
output:
  ledger_path: results/m5/preview-coherent-mscp/forecast-ledger.parquet
  streaming: true
execution:
  backend: auto
  seed: 42
