name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy calibre/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks
      - run: uv run python benchmarks/vn2/download_vn2_data.py
      - run: uv run pytest

  dask-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks --extra dask
      - run: uv run pytest tests/integration/test_dask.py

  s3-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks --extra s3
      - run: uv run --extra s3 --with 'moto[server]' pytest tests/integration/test_s3_ingestion.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build full image
        run: docker build -t calibre:full .
      - name: Smoke test full image
        run: docker run --rm calibre:full run --config /app/benchmarks/vn2/config/smoke.yaml
      - name: Build slim image
        run: docker build -f Dockerfile.slim -t calibre:slim .
      - name: Smoke test slim image
        run: docker run --rm calibre:slim run --config /app/benchmarks/vn2/config/smoke.yaml
      - name: Push images to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag_prefix="pr-${{ github.event.pull_request.number }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag_prefix="main"
          else
            tag_prefix="${GITHUB_REF_NAME//\//-}"
          fi
          sha_tag="${GITHUB_SHA::12}"

          docker tag calibre:full "$image_repo:${tag_prefix}-full"
          docker tag calibre:slim "$image_repo:${tag_prefix}-slim"
          docker tag calibre:full "$image_repo:${sha_tag}-full"
          docker tag calibre:slim "$image_repo:${sha_tag}-slim"

          docker push "$image_repo:${tag_prefix}-full"
          docker push "$image_repo:${tag_prefix}-slim"
          docker push "$image_repo:${sha_tag}-full"
          docker push "$image_repo:${sha_tag}-slim"

  spark-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks --extra spark
      - run: uv run pytest tests/integration/test_spark.py
