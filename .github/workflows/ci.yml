name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run ruff check --config pyproject.toml .
      - run: uv run ruff format --check --config pyproject.toml .
      - run: uv run ty check
      - run: uv run pytest -c pyproject.toml --ignore=tests/contract
      - run: uv run pytest -c pyproject.toml tests/contract --junitxml=contract.xml
      - run: uv run python .github/scripts/contract_report.py contract.xml tests/contract/ids.txt

  frozen:
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'v2' &&
      !contains(github.event.pull_request.labels.*.name, 'contract')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/frozen_paths.py "origin/${{ github.base_ref }}" HEAD
