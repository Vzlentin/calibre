name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy calibre/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks
      - run: uv run python benchmarks/vn2/download_vn2_data.py
      - run: uv run pytest