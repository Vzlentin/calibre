name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check calibre/

  test:
    runs-on: ubuntu-latest
    env:
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      # Routes the migration-parity and deploy-smoke gates at a real Postgres
      # (the production-shaped backend) instead of SQLite. Only tests that use
      # the `fresh_db_url` fixture pick this up; the rest are unaffected.
      CALIBRE_TEST_DATABASE_URL: postgresql+psycopg://calibre:calibre@localhost:5432/calibre
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calibre
          POSTGRES_PASSWORD: calibre
          POSTGRES_DB: calibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks --extra hierarchy
      - name: Cache VN2 data
        uses: actions/cache@v4
        id: vn2-cache
        with:
          path: data/vn2
          key: vn2-data-${{ hashFiles('benchmarks/vn2/vn2_file_links.json') }}
          restore-keys: vn2-data-
      - name: Download VN2 data (cache miss only)
        if: steps.vn2-cache.outputs.cache-hit != 'true'
        run: uv run python benchmarks/vn2/download_vn2_data.py
      - run: uv run pytest

  s3-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra benchmarks --extra s3
      - run: uv run --extra s3 --with 'moto[server]' pytest tests/integration/test_s3_ingestion.py

  m5-coverage-neutrality:
    # Advisory M5 per-node coverage-neutrality gate on the committed CA slice (no
    # data download). It runs the real predict -> wls_struct reconcile -> mscp
    # pipeline only when a float-relevant path changes, and short-circuits to a
    # green report otherwise so the check never deadlocks a PR. Until the Linux
    # baseline lands (#279) the test itself skips. NOT a branch-protection
    # required check yet — measure its run-time before promoting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect float-path changes
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            calibre/reconciliation/**
            calibre/conformal/**
            calibre/evaluation/**
            calibre/execution/**
            benchmarks/m5/**
      - name: Flag float-path changes
        id: float
        run: echo "float_path=${{ steps.changed.outputs.any_changed }}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v4
        if: steps.float.outputs.float_path == 'true'
      - name: Install deps (hierarchy extra for MinTraceSparse)
        if: steps.float.outputs.float_path == 'true'
        run: uv sync --extra dev --extra benchmarks --extra hierarchy
      - name: Run M5 coverage-neutrality gate
        if: steps.float.outputs.float_path == 'true'
        run: uv run pytest tests/benchmarks/test_m5_coverage_neutrality.py
      - name: Report advisory gate result
        run: echo "m5-coverage-neutrality complete (float_path=${{ steps.float.outputs.float_path }})"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build full image
        run: docker build -t calibre:full .
      - name: Smoke test full image
        run: docker run --rm calibre:full run --config /app/benchmarks/vn2/config/smoke.yaml
      - name: Download VN2 data with full image
        run: |
          mkdir -p data
          docker run --rm --user root \
            -v "$PWD/data:/app/data" \
            --entrypoint python \
            calibre:full \
            /app/benchmarks/vn2/download_vn2_data.py --target /app/data/vn2
      - name: Smoke test full VN2 benchmark
        run: |
          docker run --rm -v "$PWD/data/vn2:/app/data/vn2:ro" \
            --entrypoint python \
            calibre:full \
            -m benchmarks.vn2 --config /app/benchmarks/vn2/config/winning.yaml
      - name: Build slim image
        run: docker build -f Dockerfile.slim -t calibre:slim .
      - name: Smoke test slim image
        run: docker run --rm calibre:slim run --config /app/benchmarks/vn2/config/smoke.yaml
      - name: Push images to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag_prefix="pr-${{ github.event.pull_request.number }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag_prefix="main"
          else
            tag_prefix="${GITHUB_REF_NAME//\//-}"
          fi
          sha_tag="${GITHUB_SHA::12}"

          docker tag calibre:full "$image_repo:${tag_prefix}-full"
          docker tag calibre:slim "$image_repo:${tag_prefix}-slim"
          docker tag calibre:full "$image_repo:${sha_tag}-full"
          docker tag calibre:slim "$image_repo:${sha_tag}-slim"

          docker push "$image_repo:${tag_prefix}-full"
          docker push "$image_repo:${tag_prefix}-slim"
          docker push "$image_repo:${sha_tag}-full"
          docker push "$image_repo:${sha_tag}-slim"

