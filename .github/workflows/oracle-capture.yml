name: oracle-capture
# Read-only oracle capture minting (KTD-A6). Manual full-SHA dispatch only:
# the job checks out and verifies the *input* candidate SHA (default-branch
# dispatch never substitutes main's code), verifies the pinned oracle tag,
# lockfile, and all twelve VN2 inputs, runs the tag-side extraction helper
# inside the oracle's own frozen venv, and uploads a manifest-complete,
# digest-bound bundle. The workflow filesystem is never persistence: the
# exact bytes enter the repository only through the reviewed U7b promotion PR.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-hex candidate SHA whose runner/validators to use"
        required: true

permissions:
  contents: read

env:
  ORACLE_TAG: oracle-freeze-2026-07-06
  ORACLE_COMMIT: 686a1b284a4f4879123b4095d306f07b88d2ddc3
  ORACLE_LOCK_SHA256: 5cc585d347195861d81760e16a675bd2a05b51777cf90c13d9af0ab05bb743f3
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate candidate SHA
        run: |
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "candidate_sha must be a full 40-hex SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out HEAD equals the candidate input
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Refuse a non-ratified capture runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64" \
            || { echo "capture runner must be x86_64"; exit 1; }
          test "${ImageOS:-}" = "ubuntu24" \
            || { echo "capture runner image OS must be ubuntu24"; exit 1; }
          test -n "${ImageVersion:-}" \
            || { echo "capture runner image version is unavailable"; exit 1; }
          python3 -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))' \
            || { echo "capture runner Python must be 3.12"; exit 1; }
      - name: Fetch and verify the oracle tag
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${ORACLE_TAG}:refs/tags/${ORACLE_TAG}" --no-tags --force
          resolved="$(git rev-parse "${ORACLE_TAG}^{}")"
          test "$resolved" = "$ORACLE_COMMIT" \
            || { echo "oracle tag resolves to $resolved, expected $ORACLE_COMMIT"; exit 1; }
      - name: Create detached oracle worktree and verify its lock
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/oracle-tag" "$ORACLE_COMMIT"
          lock_sha="$(sha256sum "${RUNNER_TEMP}/oracle-tag/uv.lock" | cut -d' ' -f1)"
          test "$lock_sha" = "$ORACLE_LOCK_SHA256" \
            || { echo "oracle uv.lock sha256 $lock_sha, expected $ORACLE_LOCK_SHA256"; exit 1; }
      - uses: astral-sh/setup-uv@v4
      - name: Provision the oracle venv (frozen)
        working-directory: ${{ runner.temp }}/oracle-tag
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra benchmarks
          lock_sha="$(sha256sum uv.lock | cut -d' ' -f1)"
          test "$lock_sha" = "$ORACLE_LOCK_SHA256" || { echo "lock changed during sync"; exit 1; }
      - name: Acquire + unconditionally validate the twelve VN2 inputs
        env:
          DATASETS_MIRROR_REPO: ${{ vars.DATASETS_MIRROR_REPO }}
          GH_TOKEN: ${{ secrets.DATASETS_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/stage3_vn2_data.py download --target "${RUNNER_TEMP}/oracle-tag/data/vn2"
          python3 .github/scripts/stage3_vn2_data.py verify --target "${RUNNER_TEMP}/oracle-tag/data/vn2" \
            --inventory stage3/evidence/vn2-input-digests.json
      - name: Run the tag-side extraction helper inside the oracle venv
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle/orders"
          "${RUNNER_TEMP}/oracle-tag/.venv/bin/python" .github/scripts/stage3_oracle_extract.py \
            --worktree "${RUNNER_TEMP}/oracle-tag" \
            --out "${RUNNER_TEMP}/bundle/orders"
      - name: Record oracle numeric environment from the synced venv
        run: |
          "${RUNNER_TEMP}/oracle-tag/.venv/bin/python" newcalibre/scripts/capture_oracle_vn2.py \
            environment --out "${RUNNER_TEMP}/bundle/environment.json"
      - name: Assemble the manifest-complete bundle
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 .github/scripts/stage3_capture_manifest.py \
            --bundle "${RUNNER_TEMP}/bundle" \
            --config "${RUNNER_TEMP}/oracle-tag/benchmarks/vn2/config/vn2-winning-loop.yaml" \
            --input-inventory stage3/evidence/vn2-input-digests.json \
            --environment "${RUNNER_TEMP}/bundle/environment.json" \
            --actuals-semantics censored_sales_surrogate
      - name: Validate the minted bytes with the candidate runner
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 newcalibre/scripts/capture_oracle_vn2.py validate \
            --bundle "${RUNNER_TEMP}/bundle" \
            --candidate-sha "$CANDIDATE_SHA" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --config "${RUNNER_TEMP}/oracle-tag/benchmarks/vn2/config/vn2-winning-loop.yaml" \
            --input-inventory stage3/evidence/vn2-input-digests.json
      - name: Upload capture bundle
        uses: actions/upload-artifact@v4
        with:
          name: oracle-capture-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
