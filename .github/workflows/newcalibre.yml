name: newcalibre

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-hex candidate SHA"
        required: true
      mint:
        description: "Upload a compact bundle and proposed tracking line"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  newcalibre-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --project newcalibre --locked --group dev
      - run: uv run --project newcalibre --locked --no-sync ruff check newcalibre
      - run: uv run --project newcalibre --locked --no-sync ruff format --check newcalibre
      - working-directory: newcalibre
        run: uv run --locked --no-sync ty check src/newcalibre/

  newcalibre-unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Test live Stage 3 automation contracts
        run: |
          uv sync --project newcalibre --locked --group dev
          uv run --project newcalibre --locked --no-sync pytest \
            tests/test_stage3_automation.py tests/test_stage3_vn2_automation.py
      - name: Build successor-only export
        run: |
          set -euo pipefail
          export_root="${RUNNER_TEMP}/successor-export"
          mkdir -p "$export_root"
          rsync -a --exclude '.git' newcalibre/ "$export_root/newcalibre/"
          echo "EXPORT_ROOT=$export_root" >> "$GITHUB_ENV"
      - name: Provision export environment
        working-directory: ${{ env.EXPORT_ROOT }}/newcalibre
        run: uv sync --locked --group dev
      - name: Run Tier 1 without repository, captures, or network
        working-directory: ${{ env.EXPORT_ROOT }}/newcalibre
        run: |
          set -euo pipefail
          test ! -e "$EXPORT_ROOT/.git"
          test ! -e "$EXPORT_ROOT/stage3"
          test ! -e "$EXPORT_ROOT/calibre"
          sudo unshare -n sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            "UV_CACHE_DIR=${UV_CACHE_DIR:-$HOME/.cache/uv}" bash -c '
              set -euo pipefail
              uv run --no-sync python -c "
          import socket, sys
          try:
              socket.create_connection((\"1.1.1.1\", 443), timeout=3)
          except OSError:
              sys.exit(0)
          sys.exit(1)
          "
              uv run --no-sync pytest tests/tier1
            '

  newcalibre-consistency:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --project newcalibre --locked --group dev
      - name: Run Tier 2 twice
        run: |
          NEWCALIBRE_TIER2_OUT="${RUNNER_TEMP}/tier2-a" \
            uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier2
          NEWCALIBRE_TIER2_OUT="${RUNNER_TEMP}/tier2-b" \
            uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier2
          diff -r "${RUNNER_TEMP}/tier2-a" "${RUNNER_TEMP}/tier2-b"

  vn2-acceptance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      VN2_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Validate manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "candidate_sha must be a full 40-hex SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@v4
      - name: Require canonical VN2 evidence and harnesses
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VN2_CANDIDATE_SHA"
          test -f newcalibre/benchmarks/vn2/vn2-input-digests.json
          test -f newcalibre/benchmarks/vn2/protocol.yaml
          test -f newcalibre/benchmarks/vn2/gate-b-split-window-sum.yaml
          test -f stage3/evidence/captures/vn2/manifest.json
          test -f newcalibre/tests/tier3/test_conditional_replay.py
          test -f newcalibre/tests/tier4/vn2/test_vn2_acceptance.py
          test -f newcalibre/tests/tier4/vn2/test_vn2_gate_b_advisory.py
      - name: Restore canonical VN2 inputs
        id: vn2-cache
        uses: actions/cache@v4
        with:
          path: newcalibre/data/vn2
          key: vn2-${{ hashFiles('newcalibre/benchmarks/vn2/vn2-input-digests.json') }}
      - name: Acquire and verify VN2 inputs with successor tooling
        env:
          OVENTI_DATASET_BASE_URL: ${{ vars.OVENTI_DATASET_BASE_URL }}
        run: |
          set -euo pipefail
          inventory=newcalibre/benchmarks/vn2/vn2-input-digests.json
          target=newcalibre/data/vn2
          if [[ "${{ steps.vn2-cache.outputs.cache-hit }}" != "true" ]]; then
            : "${OVENTI_DATASET_BASE_URL:?OVENTI_DATASET_BASE_URL must be configured}"
            mkdir -p "$target"
            while IFS= read -r name; do
              [[ "$name" != */* && "$name" != "." && "$name" != ".." ]] \
                || { echo "inventory contains an unsafe basename: $name"; exit 1; }
              curl --fail --location --retry 3 \
                --output "$target/$name" \
                "${OVENTI_DATASET_BASE_URL%/}/vn2/$name"
            done < <(jq -r '.files[].name' "$inventory")
          fi
          uv sync --project newcalibre --locked --group dev
          uv run --project newcalibre --locked --no-sync python newcalibre/scripts/vn2_data.py verify \
            --target "$target" \
            --inventory "$inventory"
      - name: Run conditional replay and biting witness
        run: uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier3
      - name: Run generic-engine VN2 acceptance and R1-R4 emission
        run: uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier4/vn2
      - name: Build proposed compact tracking line
        if: github.event_name == 'workflow_dispatch' && inputs.mint
        run: |
          uv run --project newcalibre --locked --no-sync python newcalibre/scripts/vn2_tracking.py build \
            --result-root newcalibre/artifacts/vn2 \
            --candidate-sha "$VN2_CANDIDATE_SHA" \
            --config newcalibre/benchmarks/vn2/protocol.yaml \
            --input-inventory newcalibre/benchmarks/vn2/vn2-input-digests.json \
            --lockfile newcalibre/uv.lock \
            --capture stage3/evidence/captures/vn2 \
            --oracle-config benchmarks/vn2/config/vn2-winning-loop.yaml \
            --output newcalibre/artifacts/vn2-tracking/proposed-record.jsonl
      - name: Upload compact evidence for a reviewed evidence-only PR
        if: github.event_name == 'workflow_dispatch' && inputs.mint
        uses: actions/upload-artifact@v4
        with:
          name: vn2-compact-evidence-${{ env.VN2_CANDIDATE_SHA }}
          path: |
            newcalibre/artifacts/vn2/
            newcalibre/artifacts/vn2-tracking/proposed-record.jsonl
          if-no-files-found: error

  m5-acceptance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      M5_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Validate manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "candidate_sha must be a full 40-hex SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@v4
      - name: Require canonical M5 inputs, config, and harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M5_CANDIDATE_SHA"
          test -f newcalibre/benchmarks/m5/m5-inputs.json
          test -f newcalibre/tests/fixtures/m5/reduced-real.yaml
          test -f newcalibre/tests/tier4/m5/test_m5_reduced_acceptance.py
      - name: Restore canonical M5 inputs
        id: m5-cache
        uses: actions/cache@v4
        with:
          path: newcalibre/data/m5
          key: m5-${{ hashFiles('newcalibre/benchmarks/m5/m5-inputs.json') }}
      - name: Acquire and verify M5 inputs with successor tooling
        env:
          OVENTI_DATASET_BASE_URL: ${{ vars.OVENTI_DATASET_BASE_URL }}
        run: |
          set -euo pipefail
          inventory=newcalibre/benchmarks/m5/m5-inputs.json
          target=newcalibre/data/m5
          if [[ "${{ steps.m5-cache.outputs.cache-hit }}" != "true" ]]; then
            : "${OVENTI_DATASET_BASE_URL:?OVENTI_DATASET_BASE_URL must be configured}"
            mkdir -p "$target"
            while IFS= read -r name; do
              [[ "$name" != */* && "$name" != "." && "$name" != ".." ]] \
                || { echo "inventory contains an unsafe basename: $name"; exit 1; }
              curl --fail --location --retry 3 \
                --output "$target/$name" \
                "${OVENTI_DATASET_BASE_URL%/}/m5/$name"
            done < <(jq -r '.files[].name' "$inventory")
          fi
          uv sync --project newcalibre --locked --group dev
          uv run --project newcalibre --locked --no-sync python newcalibre/scripts/m5_data.py verify \
            --target "$target" \
            --inventory "$inventory"
      - name: Run reduced real-M5 acceptance and measure runner headroom
        run: |
          set -euo pipefail

          aggregate_rss_kib() {
            ps -e -o pid=,ppid=,rss= | awk -v root="$1" '
              { parent[$1] = $2; rss[$1] = $3 }
              END {
                included[root] = 1
                changed = 1
                while (changed) {
                  changed = 0
                  for (pid in parent) {
                    if (!included[pid] && included[parent[pid]]) {
                      included[pid] = 1
                      changed = 1
                    }
                  }
                }
                for (pid in included) total += rss[pid]
                print total + 0
              }
            '
          }

          started_at=$(date +%s)
          min_memory_headroom_kib=$(awk '/MemAvailable:/ { print $2 }' /proc/meminfo)
          min_free_disk_kib=$(df -Pk newcalibre | awk 'NR == 2 { print $4 }')
          peak_process_rss_kib=0

          uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier4/m5 &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            process_rss_kib=$(aggregate_rss_kib "$test_pid")
            memory_headroom_kib=$(awk '/MemAvailable:/ { print $2 }' /proc/meminfo)
            free_disk_kib=$(df -Pk newcalibre | awk 'NR == 2 { print $4 }')
            (( process_rss_kib > peak_process_rss_kib )) \
              && peak_process_rss_kib=$process_rss_kib
            (( memory_headroom_kib < min_memory_headroom_kib )) \
              && min_memory_headroom_kib=$memory_headroom_kib
            (( free_disk_kib < min_free_disk_kib )) \
              && min_free_disk_kib=$free_disk_kib
            sleep 1
          done

          test_status=0
          wait "$test_pid" || test_status=$?
          elapsed_seconds=$(( $(date +%s) - started_at ))

          echo "M5 acceptance elapsed seconds: $elapsed_seconds"
          echo "M5 aggregate peak job memory (process RSS) KiB: $peak_process_rss_kib"
          echo "M5 minimum memory headroom KiB: $min_memory_headroom_kib"
          echo "M5 minimum free disk KiB: $min_free_disk_kib"

          sizing_status=0
          minimum_headroom_kib=$(( 4 * 1024 * 1024 ))
          (( min_memory_headroom_kib >= minimum_headroom_kib )) \
            || { echo "M5 acceptance requires at least 4 GiB memory headroom"; sizing_status=1; }
          (( min_free_disk_kib >= minimum_headroom_kib )) \
            || { echo "M5 acceptance requires at least 4 GiB free disk"; sizing_status=1; }
          (( elapsed_seconds <= 20 * 60 )) \
            || { echo "M5 acceptance must complete within 20 minutes"; sizing_status=1; }
          (( test_status == 0 && sizing_status == 0 ))

  reference-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      REFERENCE_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Validate manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "candidate_sha must be a full 40-hex SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@v4
      - name: Require reference harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REFERENCE_CANDIDATE_SHA"
          test -f newcalibre/tests/tier4/reference/aci/test_aci_reference.py
          test -f newcalibre/tests/tier4/reference/aci/test_aci_reference_witness.py
      - run: uv sync --project newcalibre --locked --group dev
      - name: Run hermetic reference gates
        run: uv run --project newcalibre --locked --no-sync pytest newcalibre/tests/tier4/reference
