[project]
name = "libcalibre"
version = "0.1.0"
description = "Conformal forecasting: point forecasts, hierarchy reconciliation, and calibrated bands."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Dusserre", email = "valentindusserre@gmail.com" }]
keywords = [
    "conformal prediction",
    "forecasting",
    "time series",
    "hierarchical reconciliation",
    "prediction intervals",
    "inventory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/Vzlentin/calibre"
Repository = "https://github.com/Vzlentin/calibre"
Issues = "https://github.com/Vzlentin/calibre/issues"
Documentation = "https://github.com/Vzlentin/calibre/tree/main/docs"
Changelog = "https://github.com/Vzlentin/calibre/blob/main/CHANGELOG.md"

[project.optional-dependencies]
stats = ["statsforecast"]
ml = ["mlforecast"]
neural = ["neuralforecast"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mlforecast",
    "neuralforecast",
    "pytest",
    "statsforecast",
    "ruff",
    "ty",
]

[tool.uv.build-backend]
# The distribution is libcalibre because PyPI already has calibre; the import name stays calibre.
module-name = "calibre"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
# Warnings raised inside vendor libraries about their own internals.
filterwarnings = [
    "ignore:.*does not have many workers",
    "ignore:GPU available but not used",
    "ignore:.*LeafSpec.*is deprecated",
    "ignore:The copy keyword is deprecated",
    "ignore:The given NumPy array is not writable",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"
