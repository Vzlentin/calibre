[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre"
version = "0.1.0"
description = "Demand planning engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "fugue",
    "statsforecast",
]

[project.optional-dependencies]
ml = [
    "mlforecast",
    "lightgbm",
    "xgboost",
]
neural = [
    "neuralforecast",
]
all = [
    "calibre[ml,neural]",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
