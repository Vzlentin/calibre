[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre"
version = "0.1.0"
description = "Demand planning engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "fsspec",
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "prometheus-client",
    "statsforecast",
    "optuna",
    "threadpoolctl",
    "uvicorn",
]

[project.scripts]
calibre = "calibre.cli.main:app"

[project.optional-dependencies]
dev = [
    "httpx",
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
    "moto[server,s3]",
    "types-PyYAML",
    "pandas-stubs>=3.0.0.260204",
    "ray[default,tune]>=2.38,<3",
    "mlforecast",
    "lightgbm",
    "xgboost<2",
]
benchmarks = [
    "mlforecast",
    "lightgbm",
    "ray[default,tune]>=2.38,<3",
    "mlflow>=2.17,<3",
]
ray = ["ray[default,tune]>=2.38,<3"]
s3 = ["s3fs"]
azure = ["adlfs"]
gcs = ["gcsfs"]
cloud = ["s3fs", "adlfs", "gcsfs"]
ml = ["mlforecast", "lightgbm"]
neural = ["neuralforecast", "torch"]
xgboost = ["xgboost<2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = []

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/databricks_notebook.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E501"]
"calibre/cli/**" = ["T20"]

[tool.ty.environment]
python-version = "3.11"

# neuralforecast is an optional dependency (the `neural` extra) that is not
# installed in the type-checking environment, so its import and the symbols
# derived from it are unresolved here. Scope the suppression to that adapter.
[[tool.ty.overrides]]
include = ["calibre/forecasting/neuralforecast_adapter.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
