[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre"
version = "0.1.0"
description = "Demand planning engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "fugue",
    "statsforecast",
    "mlforecast",
    "lightgbm",
    "xgboost",
    "neuralforecast",
    "pandas-stubs>=3.0.0.260204",
    "optuna",
    "mlflow>=2.17,<3",
    "optuna-integration[mlflow]>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["T20", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "statsforecast.*",
    "neuralforecast.*",
    "mlforecast.*",
    "lightgbm.*",
    "xgboost.*",
    "fugue.*",
    "optuna.*",
    "optuna_integration.*",
    "mlflow.*",
    "requests.*",
    "pyarrow.*",
]
ignore_missing_imports = true
