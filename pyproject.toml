[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre"
version = "0.1.0"
description = "Demand planning engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "fsspec",
    "fugue",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "prometheus-client",
    "statsforecast",
    "mlforecast",
    "lightgbm",
    "optuna",
    "uvicorn",
]

[project.scripts]
calibre = "calibre.cli.main:app"

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
    "mypy",
    "moto[server,s3]",
    "types-PyYAML",
    "pandas-stubs>=3.0.0.260204",
    "xgboost",
]
benchmarks = [
    "mlflow>=2.17,<3",
    "optuna-integration[mlflow]>=4.0",
]
s3 = ["s3fs"]
azure = ["adlfs"]
gcs = ["gcsfs"]
cloud = ["s3fs", "adlfs", "gcsfs"]
dask = ["dask[distributed]"]
spark = ["pyspark"]
neural = ["neuralforecast"]
xgboost = ["xgboost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that require a local Spark runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/databricks_notebook.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "statsforecast.*",
    "neuralforecast.*",
    "mlforecast.*",
    "lightgbm.*",
    "xgboost.*",
    "fugue.*",
    "fugue_dask.*",
    "fugue_spark.*",
    "fsspec",
    "fsspec.*",
    "fsspec.core.*",
    "distributed.*",
    "sqlalchemy.*",
    "alembic.*",
    "psycopg.*",
    "optuna.*",
    "optuna_integration.*",
    "mlflow.*",
    "requests.*",
    "pyarrow.*",
    "pyspark.*",
]
ignore_missing_imports = true
