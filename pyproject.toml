[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre"
version = "0.1.0"
description = "Demand planning engine"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "fsspec",
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "prometheus-client",
    "scipy>=1.12",
    "statsforecast",
    "optuna",
    "threadpoolctl",
    "uvicorn",
]

[project.scripts]
calibre = "calibre.cli.main:app"

[project.optional-dependencies]
dev = [
    "datasetsforecast",
    "httpx",
    "pytest",
    "ruff",
    "ty",
    "moto[server,s3]",
    "types-PyYAML",
    "pandas-stubs>=3.0.0.260204",
    "ray[default,tune]>=2.38,<3",
    "mlforecast",
    "lightgbm",
    "xgboost<2",
]
benchmarks = [
    "mlforecast",
    "lightgbm",
    "ray[default,tune]>=2.38,<3",
    "mlflow>=2.17,<3",
]
ray = ["ray[default,tune]>=2.38,<3"]
s3 = ["s3fs"]
azure = ["adlfs"]
gcs = ["gcsfs"]
cloud = ["s3fs", "adlfs", "gcsfs"]
hierarchy = ["hierarchicalforecast~=1.5"]
ml = ["mlforecast", "lightgbm"]
neural = ["neuralforecast", "torch"]
xgboost = ["xgboost<2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: heavyweight end-to-end gates that pin numerical baselines (deselect locally with -m 'not regression')",
]

[tool.hatch.build.targets.sdist]
# The successor project is its own uv project; its tree never ships in the
# frozen engine's source distribution (wheels already exclude it by package
# selection).
exclude = ["newcalibre"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/databricks_notebook.py"]
# The successor project carries its own Ruff config and lockfile; root-level
# `ruff check .` discovery must never lint or rewrite it.
extend-exclude = ["newcalibre"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    # Minimal pydocstyle (D) subset: docstring presence + summary-line format.
    # D102 (public methods) and D107 (__init__) are covered by the written
    # convention in CLAUDE.md, not the gate, to keep the subset minimal.
    "D100",  # public module has a docstring
    "D104",  # public package (__init__.py) has a docstring
    "D101",  # public class has a docstring
    "D103",  # public function has a docstring
    "D205",  # blank line between summary and description
    "D212",  # multi-line summary starts on the first line
    "D415",  # summary ends with '.', '?', or '!'
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E501"]
"calibre/cli/**" = ["T20"]
# CI automation scripts talk to workflow logs via stdout.
".github/scripts/**" = ["T20"]
# /go skill CLIs report to the orchestrating agent via stdout/stderr.
".agents/skills/go/scripts/**" = ["T20"]
# Test modules carry only D100 (a module docstring). Per-function (D103),
# grouping-class (D101), and package (D104) docstrings are not external-reader
# API, so they are exempt to honor the minimal intent.
"tests/**" = ["D103", "D101", "D104"]
# Auto-generated Alembic revisions are not external-reader prose and are
# regenerated on the next migration; exempt them from the docstring gate
# entirely. The whole ``D`` category is ignored (not just D100/D103/D104) so a
# freshly generated revision docstring — whose summary has no trailing period —
# does not trip the D205/D212/D415 summary-format rules.
"calibre/storage/migrations/versions/**" = ["D"]

[tool.ty.environment]
python-version = "3.11"

# neuralforecast is an optional dependency (the `neural` extra) that is not
# installed in the type-checking environment, so its import and the symbols
# derived from it are unresolved here. Scope the suppression to that adapter.
[[tool.ty.overrides]]
include = ["calibre/forecasting/neuralforecast_adapter.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"

